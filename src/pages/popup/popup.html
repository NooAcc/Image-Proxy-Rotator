<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>代理分流状态</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/components.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>

<!--
  三段固定布局：顶部常驻、中间分段切换、下方唯一滚动区。
  旧版 .popup 整体可滚动，而日志列表自己又带 max-height + overflow-y，
  形成嵌套滚动 —— 节点一多总高超过弹窗上限时，滚轮停在日志区就滚不动外层。
  现在只有 #paneBody 一处滚动，那个问题从结构上消失。
-->
<header class="head">
  <div class="head__row">
    <span class="head__status" id="statusChip"></span>
    <label class="switch switch--sm head__switch">
      <span class="sr-only" id="masterLabel">总开关</span>
      <input type="checkbox" id="masterSwitch" aria-labelledby="masterLabel">
    </label>
  </div>

  <div class="alerts">
    <div class="banner banner--err" id="errorBanner" hidden></div>
    <div class="banner banner--warn" id="controlWarning" hidden></div>
    <div class="banner banner--err" id="unsupportedWarning" hidden></div>
  </div>

  <p class="sr-only" id="statusSummary" role="status"></p>

  <!-- 四个数字单独念出来毫无意义，所以完整语义由上面的 #statusSummary 播报 -->
  <div class="stats">
    <div class="stat">
      <span class="stat__num num" id="statTotal">–</span>
      <span class="stat__lbl">节点</span>
    </div>
    <div class="stat">
      <span class="stat__num num status--ok" id="statAvailable">–</span>
      <span class="stat__lbl">可用</span>
    </div>
    <div class="stat">
      <span class="stat__num num status--warn" id="statDisabled">–</span>
      <span class="stat__lbl">已禁用</span>
    </div>
    <div class="stat">
      <span class="stat__num num" id="statAvgLatency">–</span>
      <span class="stat__lbl">平均延迟</span>
    </div>
  </div>

  <div class="btn-row head__actions">
    <button type="button" class="btn btn--primary btn--sm" id="btnProbeAll">一键测速</button>
    <button type="button" class="btn btn--sm" id="btnOptions">设置</button>
    <button type="button" class="btn btn--sm" id="btnClearLogs">清空日志</button>
  </div>

  <!--
    这里刻意**不用** role="tablist"/"tab"：那套模式要求方向键漫游 + roving tabindex，
    只做一半比不做更糟。三个普通按钮配 aria-pressed，语义准确且 Tab 键天然可达。
  -->
  <div class="segmented" role="group" aria-label="切换视图">
    <button type="button" class="seg" id="tabNodes">节点</button>
    <button type="button" class="seg" id="tabRules">规则</button>
    <button type="button" class="seg" id="tabLogs">活动</button>
  </div>

  <div class="head__filter" id="logFilterRow" hidden>
    <label class="sr-only" for="logFilter">活动筛选</label>
    <select id="logFilter">
      <option value="">全部</option>
      <option value="kind:probe">测速</option>
      <option value="kind:request">请求</option>
      <option value="kind:proxy">代理</option>
      <option value="level:error">仅错误</option>
    </select>
  </div>
</header>

<!-- 唯一的滚动区。三个视图共用它，所以弹窗总高恒定。
     tabindex 是必要的：键盘用户需要能聚焦这块才能用方向键滚动。 -->
<div class="body" id="paneBody" role="region" tabindex="0"></div>

<script type="module" src="popup.js"></script>
</body>
</html>
